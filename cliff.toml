# git-cliff turns the conventional commits into the changelog part of a release's notes
# (scripts/release-notes.sh), and works out the next version from them.
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}\
{% endfor %}
{% endfor %}

"""
trim = false

# While the version is 0.x, a feature bumps the minor version and so does a breaking change;
# everything else bumps the patch version.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Enhancements" },
  { message = "^fix", group = "<!-- 1 -->🩹 Fixes" },
  { message = "^perf", group = "<!-- 2 -->🔥 Performance" },
  { message = "^refactor", group = "<!-- 3 -->💅 Refactors" },
  { message = "^docs", group = "<!-- 4 -->📖 Documentation" },
  { message = "^test", group = "<!-- 5 -->✅ Tests" },
  { message = "^build", group = "<!-- 6 -->📦 Build" },
  { message = "^ci", group = "<!-- 7 -->🤖 CI" },
  { message = "^chore|^style", group = "<!-- 8 -->🏡 Chore" },
]
