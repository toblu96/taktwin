name: release

# A tag v0.2.0 on a commit whose internal/version says 0.2.0 builds the app for Windows and
# macOS and publishes a GitHub release with the installers, SHA256SUMS and the notes of
# scripts/release-notes.sh: highlights written by hand, the changelog, and how to install. A tag with a pre-release, such as
# v0.2.0-beta.1, makes a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match internal/version ($v): run scripts/set-version.sh and tag that commit"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/test.yml

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The CLI of the same Wails version as the app's go.mod.
      - shell: bash
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # Installed per user, so that it installs and updates without administrator rights.
      - run: wails3 task windows:package INSTALL_SCOPE=user
      - shell: bash
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir dist
          # Where the installer lands depends on the project's NSIS script: bin/ here, build/windows/nsis/ in the Wails docs.
          installer=""
          for f in bin/*installer*.exe build/windows/nsis/*installer*.exe; do
            if [ -f "$f" ]; then installer=$f; break; fi
          done
          test -n "$installer" || { echo "::error::no installer was built"; ls bin build/windows/nsis; exit 1; }
          echo "installer: $installer"
          cp "$installer" "dist/Taktwin-$v-windows-x64-setup.exe"
          cp bin/taktwin.exe "dist/Taktwin-$v-windows-x64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The CLI of the same Wails version as the app's go.mod.
      - shell: bash
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      # One app for Apple silicon and Intel, signed ad hoc only.
      - run: wails3 task darwin:package:universal
      - run: |
          v=${{ needs.version.outputs.version }}
          mkdir -p dist dmg
          ditto bin/taktwin.app dmg/Taktwin.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Taktwin $v" -srcfolder dmg -ov -format UDZO "dist/Taktwin-$v-macos-universal.dmg"
          ditto -c -k --keepParent dmg/Taktwin.app "dist/Taktwin-$v-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The highlights of .github/releases/<tag>.md, the changelog of the conventional commits
      # since the tag before, and how to install.
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md
      - run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Taktwin $GITHUB_REF_NAME" --notes-file notes.md $pre
        env:
          GH_TOKEN: ${{ github.token }}
