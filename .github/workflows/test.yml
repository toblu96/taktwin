name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  go:
    # The app links the system's webview through cgo, which on Linux needs the GTK and WebKitGTK
    # development packages. Wails' cgo-free backend (-tags purego) needs none of them to build,
    # so the tests run on Linux without cgo, instead of waiting for a macOS runner.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -tags=purego
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The app's own package embeds the built frontend, so it is left out here; the
      # packages below hold the engine, the builder, the file formats and the guard.
      - run: go vet ./internal/... ./cmd/... ./catalog/...
      - run: go test ./internal/... ./cmd/... ./catalog/...
      - run: go test ./...
        working-directory: st

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
