name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The app's own package embeds the built frontend, so it is left out here; the
      # packages below hold the engine, the builder, the file formats and the guard.
      - run: go vet ./internal/... ./cmd/... ./catalog/...
      - run: go test ./internal/... ./cmd/... ./catalog/...
      - run: go test ./...
        working-directory: st
