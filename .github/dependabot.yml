# Weekly pull requests for outdated dependencies, titled as conventional commits so that they
# pass the title check and show in the changelog.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directories: [/, /st]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # vue-tsc, which type-checks the Vue files, does not run on TypeScript 7 (the native
      # compiler) yet: it needs TypeScript's JavaScript API. Take TypeScript 7 once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend:
        patterns: ['*']
